
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Images</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
        }
        img {
            width: 45vw;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="water-perserve-1.png" alt="Water Preserve 1">
        <img src="water-perserve-8.png" alt="Water Preserve 8">
        <img src="water-perserve-9.png" alt="Water Preserve 9">
        <img src="water-perserve-2.png" alt="Water Preserve 2">
        <img src="water-perserve-3.png" alt="Water Preserve 3">
        <img src="water-perserve-4.png" alt="Water Preserve 4">
        <img src="water-perserve-5.png" alt="Water Preserve 5">
        <img src="water-perserve-6.png" alt="Water Preserve 6">
        <img src="water-perserve-7.png" alt="Water Preserve 7">
    </div>
</body>
</html>
