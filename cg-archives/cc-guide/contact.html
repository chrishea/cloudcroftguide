<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Cloudcroft Guide</title>
    <style>
        body { font-family: sans-serif; background-color: #FDFBF7; padding: 50px; }
        .form-box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
        button { background: #E67E22; color: white; border: none; padding: 15px 20px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Submit a Local Tip</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <select>
                <option>Suggest a Business</option>
                <option>Report a Trail Condition</option>
                <option>General Inquiry</option>
            </select>
            <textarea placeholder="Tell us more..." rows="5"></textarea>
            <button type="submit">Send to Cloudcroft Guide</button>
        </form>
        <p><a href="index.html">← Back to Guide</a></p>
    </div>
</body>
</html>
